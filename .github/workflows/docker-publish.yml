name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: vamsi532
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          echo "Building backend Docker image..."
          docker build -t vamsi532/post-backend:latest ./backend
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Pushing backend image to Docker Hub..."
            docker push vamsi532/post-backend:latest
          fi

      - name: Build & Push Frontend Image
        run: |
          echo "Building frontend Docker image..."
          docker build --build-arg VITE_API_URL=/api -t vamsi532/post-frontend:latest ./frontend
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Pushing frontend image to Docker Hub..."
            docker push vamsi532/post-frontend:latest
          fi

name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Step 1: Automated Unit & Integration Tests
  # ==========================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - Install & Test
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm test

      - name: Frontend - Install & Test
        run: |
          cd frontend
          npm ci
          npm test

  # ==========================================
  # Step 2: Build & Push Docker Images
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/post-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/post-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/post-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/post-frontend:${{ github.sha }}

  # ==========================================
  # Step 3: Deploy to AWS EC2 via SSH
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/app"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            echo "🔑 Creating production .env file..."
            cat << 'EOF' > .env
            NODE_ENV=production
            PORT=5000
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            JWT_EXPIRES_IN=1d
            DOCKER_IMAGE_BACKEND="${{ secrets.DOCKERHUB_USERNAME }}/post-backend:latest"
            DOCKER_IMAGE_FRONTEND="${{ secrets.DOCKERHUB_USERNAME }}/post-frontend:latest"
            EOF

            echo "🐳 Logging into Docker Hub on EC2..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "📥 Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "🚀 Starting updated containers with zero downtime..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Cleaning up dangling/old images..."
            docker image prune -f

            echo "🩺 Verifying deployment status..."
            docker compose -f docker-compose.prod.yml ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: devtodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postsdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postsdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devtodo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-krishnavamsigara}/devtodo-backend:${IMAGE_TAG:-latest}
    container_name: devtodo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-postsdb}?schema=public
      JWT_SECRET: ${JWT_SECRET:-devtodo-super-secret-jwt-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtodo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${DOCKERHUB_USERNAME:-krishnavamsigara}/devtodo-frontend:${IMAGE_TAG:-latest}
    container_name: devtodo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
      - "${FRONTEND_ALT_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - devtodo-network

volumes:
  postgres_data:
    driver: local

networks:
  devtodo-network:
    driver: bridge
